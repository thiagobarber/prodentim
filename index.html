  @keyframes pulseGlow {

    50% { box-shadow: 0 10px 30px -8px rgba(229,74,40,0.7), 0 0 0 12px rgba(255,107,74,0); }
  }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-4px); }
    75% { transform: translateX(4px); }
  }
  @keyframes typing {
    0% { opacity: 0.3; transform: translateY(0); }
    50% { opacity: 1; transform: translateY(-3px); }
    100% { opacity: 0.3; transform: translateY(0); }
  }

  .float-gentle { animation: floatGentle 5s ease-in-out infinite; }

  .typing-dot {

  .typing-dot:nth-child(3) { animation-delay: 0.4s; }

  /* Custom scrollbar for chat area */
  .chat-scroll::-webkit-scrollbar { width: 6px; }

  @media (max-width: 640px) {

        { emoji: "🪥", text: "Brushing 3+ times a day", value: "brushing" },
        { emoji: "🦷", text: "Visited the dentist — no luck", value: "dentist" },
        { emoji: "💊", text: "Supplements or home remedies", value: "remedies" }
      ]
    },
    {
      // Q3 - GAIN: Paint the desired outcome
      bot: [
        "That's exactly what I expected. Here's the truth:",
        "Bad breath starts in your <b>oral microbiome</b> — the good bacteria that keep your mouth balanced. Kill them with alcohol mouthwash, and the problem <i>gets worse</i>. 🔬",

  function updateProgress(step) {

      else if (i === step) dot.classList.add('active');
    });

  function scrollChatToBottom() {

        <span class="typing-dot w-2 h-2 rounded-full bg-gray-400"></span>
      </div>
    `;
    chatArea.appendChild(typing);
    lucide.createIcons();
    scrollChatToBottom();
  }

  function removeTypingIndicator() {
    const t = document.getElementById('typing-indicator');
    if (t) t.remove();
  }

  function addBotMessage(html, delay = 0) {
    return new Promise(resolve => {
      setTimeout(() => {

        wrap.className = 'flex items-end gap-2 animate-fade-in-up';

        `;
        chatArea.appendChild(wrap);
        lucide.createIcons();
        scrollChatToBottom();
        resolve();
      }, delay);
    });
  }

  function addUserMessage(emoji, text) {
    const wrap = document.createElement('div');
    wrap.className = 'flex items-end justify-end gap-2 animate-slide-in';
    wrap.innerHTML = `
      <div class="bubble-user px-4 py-2.5 max-w-[80%] text-[15px] font-medium">
        <span class="mr-1">${emoji}</span>${text}
      </div>
    `;
    chatArea.appendChild(wrap);
    scrollChatToBottom();
  }

  async function renderStep(stepIndex) {
    updateProgress(stepIndex);
    const step = flow[stepIndex];

    if (step.reveal) {
      await renderReveal();
      return;
    }

    // Clear footer while bot "types"
    footerArea.innerHTML = '';

    // Show typing + bot messages sequentially
    for (let i = 0; i < step.bot.length; i++) {
      addTypingIndicator();
      await new Promise(r => setTimeout(r, 900));
      removeTypingIndicator();
      await addBotMessage(step.bot[i], 50);
      await new Promise(r => setTimeout(r, 400));
    }

    // Show options
    renderOptions(step.options);
  }

  function renderOptions(options) {
    footerArea.innerHTML = `

        <span>Tap your answer</span>
      </div>
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-2 sm:gap-2.5" id="options-grid"></div>
    `;
    const grid = document.getElementById('options-grid');
    options.forEach((opt, idx) => {
      const btn = document.createElement('button');
      btn.className = 'answer-btn text-left rounded-xl sm:rounded-2xl px-3 sm:px-4 py-2.5 sm:py-3 flex items-center gap-2 sm:gap-3 text-gray-800 font-medium text-[13px] sm:text-[15px] opacity-0';

      btn.innerHTML = `
        <span class="text-xl sm:text-2xl flex-shrink-0">${opt.emoji}</span>
        <span class="flex-1 min-w-0">${opt.text}</span>
        <i data-lucide="chevron-right" class="w-3.5 h-3.5 sm:w-4 sm:h-4 text-gray-400 flex-shrink-0"></i>
      `;
      btn.addEventListener('click', () => handleAnswer(opt));
      grid.appendChild(btn);
    });
    lucide.createIcons();
  }

  async function handleAnswer(opt) {
    // Disable all buttons
    document.querySelectorAll('.answer-btn').forEach(b => b.style.pointerEvents = 'none');
    addUserMessage(opt.emoji, opt.text);
    await new Promise(r => setTimeout(r, 500));
    currentStep++;
    renderStep(currentStep);
  }

    footerArea.innerHTML = '';

    addTypingIndicator();
    await new Promise(r => setTimeout(r, 1100));

          </div>
        </div>
      </div>

      <a href="${CTA_URL}" target="_blank" rel="noopener noreferrer" class="cta-btn w-full text-white font-bold text-sm sm:text-base py-3.5 sm:py-4 rounded-lg sm:rounded-2xl flex items-center justify-center gap-2 pulse-glow animate-fade-in-up" style="animation-delay: 0.15s; animation-fill-mode: both;">
